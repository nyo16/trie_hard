[package]
name = "trie_hard_native"
# Kept equal to the Elixir package version (scripts/set-version.sh writes both on release).
version = "0.3.0"
authors = ["Niko"]
edition = "2021"
rust-version = "1.91"
publish = false

[lib]
name = "trie_hard_native"
path = "src/lib.rs"
crate-type = ["cdylib"]

[dependencies]
rustler = "0.39.0"

[dev-dependencies]
proptest = "1"

[features]
default = ["nif_version_2_16"]
nif_version_2_16 = ["rustler/nif_version_2_16"]
nif_version_2_17 = ["rustler/nif_version_2_17"]

# Never `panic = "abort"`: rustler turns NIF panics into Erlang exceptions,
# which requires unwinding.
[profile.release]
lto = true
codegen-units = 1
