# https://github.com/elixir-explorer/explorer/blob/main/.github/workflows/release.yml
# https://github.com/Takashiidobe/rust-build-binary-github-actions/blob/master/.github/workflows/release.yml

name: Precomp NIFs

on:
  push:
    branches:
      - master
    paths:
      - "native/**"
      - ".github/workflows/release.yml"
      - "rust-toolchain.toml"
      - "scripts/build-nif.sh"
    tags:
      - "v*"
  pull_request:
    paths:
      - ".github/workflows/release.yml"
      - "rust-toolchain.toml"
      - "scripts/build-nif.sh"
      - "native/trie_hard_native/Cross.toml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: NIF ${{ matrix.nif }} - ${{ matrix.job.target }} (${{ matrix.job.os }})
    runs-on: ${{ matrix.job.os }}

    permissions:
      contents: read

    strategy:
      fail-fast: false
      matrix:
        nif: ["2.16", "2.17"]
        job:
          - { target: aarch64-apple-darwin,         os: macos-15 }
          - { target: aarch64-unknown-linux-gnu,    os: ubuntu-22.04, use-cross: true }
          - { target: aarch64-unknown-linux-musl,   os: ubuntu-22.04, use-cross: true }
          # - { target: arm-unknown-linux-gnueabihf,  os: ubuntu-22.04, use-cross: true }
          # - { target: riscv64gc-unknown-linux-gnu,  os: ubuntu-22.04, use-cross: true }
          - { target: x86_64-apple-darwin,          os: macos-15 }
          - { target: x86_64-pc-windows-gnu,        os: windows-2022 }
          # - { target: x86_64-pc-windows-msvc,       os: windows-2022 }
          # - { target: x86_64-unknown-freebsd,       os: ubuntu-22.04, use-cross: true }
          - { target: x86_64-unknown-linux-gnu,     os: ubuntu-22.04 }
          - { target: x86_64-unknown-linux-musl,    os: ubuntu-22.04, use-cross: true }

    steps:
      - name: Checkout source code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Extract crate information
        shell: bash
        run: |
          # Get the project version from mix.exs
          echo "PROJECT_VERSION=$(sed -n 's/^  @version "\(.*\)"/\1/p' mix.exs | head -n1)" >> $GITHUB_ENV

      - name: Check the tag matches the mix.exs version
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: |
          if [[ "$GITHUB_REF_NAME" != "v$PROJECT_VERSION" ]]; then
            echo "::error::tag $GITHUB_REF_NAME does not match mix.exs version $PROJECT_VERSION"
            exit 1
          fi

      - name: Install pinned Rust toolchain (rust-toolchain.toml)
        shell: bash
        run: rustup toolchain install

      - name: Add target
        shell: bash
        run: |
          rustup target add ${{ matrix.job.target }}

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        with:
          prefix-key: v0-precomp
          shared-key: ${{ matrix.job.target }}-${{ matrix.nif }}
          workspaces: |
            native/trie_hard_native

      # cross is installed from its release tarball, verified against a pinned
      # SHA-256; its target images are pinned by digest in Cross.toml.
      - name: Install cross v0.2.5
        if: ${{ matrix.job.use-cross }}
        shell: bash
        run: |
          curl -fsSLo cross.tar.gz https://github.com/cross-rs/cross/releases/download/v0.2.5/cross-x86_64-unknown-linux-gnu.tar.gz
          echo "642375d1bcf3bd88272c32ba90e999f3d983050adf45e66bd2d3887e8e838bad  cross.tar.gz" | sha256sum -c -
          mkdir -p "$HOME/.local/bin"
          tar -xzf cross.tar.gz -C "$HOME/.local/bin" cross
          rm cross.tar.gz
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Build the project
        id: build-crate
        shell: bash
        run: scripts/build-nif.sh "${{ matrix.job.target }}" "${{ matrix.nif }}" "${{ matrix.job.use-cross || false }}" "$PROJECT_VERSION"

      - name: Artifact upload
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ steps.build-crate.outputs.file-name }}
          path: ${{ steps.build-crate.outputs.file-path }}
          if-no-files-found: error

  publish:
    name: Attest and publish release
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-24.04

    permissions:
      contents: write
      id-token: write
      attestations: write

    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: dist
          merge-multiple: true

      - name: Artifact attestation
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/*.tar.gz

      - name: Publish archives and packages
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          files: dist/*.tar.gz
          fail_on_unmatched_files: true
