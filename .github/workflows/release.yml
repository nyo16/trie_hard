# Builds the precompiled NIFs on every relevant push/PR. Pushing a `v*` tag
# also releases: attests and publishes the artifacts as a GitHub release,
# generates the checksum file and commits it (with the version bump) to master,
# and publishes the tagged source to Hex. The tag is the source of truth for
# the version.
#
# Requirements: a `HEX_API_KEY` repository secret, and GitHub Actions allowed
# to push to master (for the checksum/version commit).

name: Precomp NIFs

on:
  push:
    branches:
      - master
    paths:
      - "native/**"
      - ".github/workflows/release.yml"
      - "rust-toolchain.toml"
      - "scripts/build-nif.sh"
      - "scripts/set-version.sh"
    tags:
      - "v*"
  pull_request:
    paths:
      - ".github/workflows/release.yml"
      - "rust-toolchain.toml"
      - "scripts/build-nif.sh"
      - "scripts/set-version.sh"
      - "native/trie_hard_native/Cross.toml"
  workflow_dispatch:

permissions:
  contents: read

env:
  OTP_VERSION: "28"
  ELIXIR_VERSION: "1.19"

jobs:
  build:
    name: NIF ${{ matrix.nif }} - ${{ matrix.job.target }} (${{ matrix.job.os }})
    runs-on: ${{ matrix.job.os }}

    permissions:
      contents: read

    strategy:
      fail-fast: false
      matrix:
        nif: ["2.16", "2.17"]
        job:
          - { target: aarch64-apple-darwin,         os: macos-15 }
          - { target: aarch64-unknown-linux-gnu,    os: ubuntu-22.04, use-cross: true }
          - { target: aarch64-unknown-linux-musl,   os: ubuntu-22.04, use-cross: true }
          # - { target: arm-unknown-linux-gnueabihf,  os: ubuntu-22.04, use-cross: true }
          # - { target: riscv64gc-unknown-linux-gnu,  os: ubuntu-22.04, use-cross: true }
          - { target: x86_64-apple-darwin,          os: macos-15 }
          - { target: x86_64-pc-windows-gnu,        os: windows-2022 }
          # - { target: x86_64-pc-windows-msvc,       os: windows-2022 }
          # - { target: x86_64-unknown-freebsd,       os: ubuntu-22.04, use-cross: true }
          - { target: x86_64-unknown-linux-gnu,     os: ubuntu-22.04 }
          - { target: x86_64-unknown-linux-musl,    os: ubuntu-22.04, use-cross: true }

    steps:
      - name: Checkout source code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Determine the version
        shell: bash
        run: |
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            # Releases take the version from the tag (validated as strict semver).
            version=$(scripts/set-version.sh --check "${GITHUB_REF_NAME#v}")
          else
            version=$(sed -n 's/^  @version "\(.*\)"/\1/p' mix.exs | head -n1)
          fi
          echo "PROJECT_VERSION=$version" >> "$GITHUB_ENV"

      - name: Install pinned Rust toolchain (rust-toolchain.toml)
        shell: bash
        run: rustup toolchain install

      - name: Add target
        shell: bash
        run: |
          rustup target add ${{ matrix.job.target }}

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        with:
          prefix-key: v0-precomp
          shared-key: ${{ matrix.job.target }}-${{ matrix.nif }}
          workspaces: |
            native/trie_hard_native

      # cross is installed from its release tarball, verified against a pinned
      # SHA-256; its target images are pinned by digest in Cross.toml.
      - name: Install cross v0.2.5
        if: ${{ matrix.job.use-cross }}
        shell: bash
        run: |
          curl -fsSLo cross.tar.gz https://github.com/cross-rs/cross/releases/download/v0.2.5/cross-x86_64-unknown-linux-gnu.tar.gz
          echo "642375d1bcf3bd88272c32ba90e999f3d983050adf45e66bd2d3887e8e838bad  cross.tar.gz" | sha256sum -c -
          mkdir -p "$HOME/.local/bin"
          tar -xzf cross.tar.gz -C "$HOME/.local/bin" cross
          rm cross.tar.gz
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Build the project
        id: build-crate
        shell: bash
        run: scripts/build-nif.sh "${{ matrix.job.target }}" "${{ matrix.nif }}" "${{ matrix.job.use-cross || false }}" "$PROJECT_VERSION"

      - name: Artifact upload
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ steps.build-crate.outputs.file-name }}
          path: ${{ steps.build-crate.outputs.file-path }}
          if-no-files-found: error

  # Runs only when every build leg succeeded, so the release is never partial.
  github_release:
    name: Attest and create the GitHub release
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-24.04

    permissions:
      contents: write
      id-token: write
      attestations: write

    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: dist
          merge-multiple: true

      - name: Artifact attestation
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/*.tar.gz

      - name: Create the release with all artifacts
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          if gh release view "$GITHUB_REF_NAME" > /dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" dist/*.tar.gz --clobber
          else
            gh release create "$GITHUB_REF_NAME" dist/*.tar.gz --verify-tag --generate-notes
          fi

  # Generates the checksum file from the published artifacts, checks it covers
  # exactly the attested bytes, and commits it with the version bump to master.
  checksum:
    name: Checksum file and version commit
    needs: github_release
    runs-on: ubuntu-24.04

    permissions:
      contents: write

    steps:
      # master, not the tag: this job pushes the checksum/version commit there.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: master

      - uses: erlef/setup-beam@54075bcc5e249e4758d363f27d099f55d843f124 # v1.24.1
        with:
          version-type: loose
          otp-version: ${{ env.OTP_VERSION }}
          elixir-version: ${{ env.ELIXIR_VERSION }}

      - name: Install pinned Rust toolchain (rust-toolchain.toml)
        run: rustup toolchain install

      - name: Set the version from the tag
        run: echo "VERSION=$(scripts/set-version.sh "${GITHUB_REF_NAME#v}")" >> "$GITHUB_ENV"

      # TRIE_HARD_BUILD=1 throughout: compiling with precompiled downloads would
      # look the host NIF up in the old checksum file and raise.
      - name: Compile and list the artifacts native.ex declares
        env:
          TRIE_HARD_BUILD: "1"
        run: |
          mix deps.get
          mix run --no-start -e '
            for {name, _url} <- RustlerPrecompiled.available_nifs(TrieHard.Native), do: IO.puts(name)
          ' | grep '\.tar\.gz$' | sort > /tmp/expected.txt
          cat /tmp/expected.txt
          test -s /tmp/expected.txt

      - name: Download the release assets and verify their attestations
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release download "$GITHUB_REF_NAME" --dir dist --pattern '*.tar.gz'
          (cd dist && ls *.tar.gz | sort) > /tmp/released.txt
          if ! diff -u /tmp/expected.txt /tmp/released.txt; then
            echo "::error::release assets differ from the artifacts native.ex declares"
            exit 1
          fi
          for asset in dist/*.tar.gz; do
            gh attestation verify "$asset" \
              --repo "$GITHUB_REPOSITORY" \
              --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/release.yml" \
              --source-ref "$GITHUB_REF" \
              --source-digest "$GITHUB_SHA" \
              --deny-self-hosted-runners
          done

      - name: Generate the checksum file
        env:
          TRIE_HARD_BUILD: "1"
        run: mix rustler_precompiled.download TrieHard.Native --all --print

      - name: The checksum file must match the attested bytes exactly
        run: |
          checksum_file=checksum-Elixir.TrieHard.Native.exs
          entries=$(grep -c '=> "sha256:' "$checksum_file")
          expected=$(wc -l < /tmp/expected.txt)
          if [[ "$entries" -ne "$expected" ]]; then
            echo "::error::$checksum_file has $entries entries, expected $expected"
            exit 1
          fi
          for asset in dist/*.tar.gz; do
            line="\"$(basename "$asset")\" => \"sha256:$(sha256sum "$asset" | cut -d' ' -f1)\""
            grep -qF -- "$line" "$checksum_file" || {
              echo "::error::$checksum_file does not match the attested bytes of $(basename "$asset")"
              exit 1
            }
          done

      - name: Commit the checksum file and version to master
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add checksum-Elixir.TrieHard.Native.exs mix.exs \
            native/trie_hard_native/Cargo.toml native/trie_hard_native/Cargo.lock
          if git diff --staged --quiet; then
            echo "Nothing to commit"
            exit 0
          fi
          git commit -m "Release $GITHUB_REF_NAME: checksum file and version"
          for attempt in 1 2 3 4 5; do
            if git push origin HEAD:master; then
              exit 0
            fi
            echo "Push rejected (attempt $attempt); rebasing onto origin/master"
            git fetch origin master
            git rebase origin/master
          done
          echo "::error::could not push the checksum commit to master"
          exit 1

  hex:
    name: Publish to Hex
    needs: checksum
    runs-on: ubuntu-24.04

    permissions:
      contents: read

    steps:
      # The tag, not master: the Hex package must be the source the NIFs were
      # built from. Only the checksum file comes from master.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Take the generated checksum file from master
        run: |
          git fetch --no-tags --depth 1 origin master
          git checkout FETCH_HEAD -- checksum-Elixir.TrieHard.Native.exs
          cat checksum-Elixir.TrieHard.Native.exs

      - uses: erlef/setup-beam@54075bcc5e249e4758d363f27d099f55d843f124 # v1.24.1
        with:
          version-type: loose
          otp-version: ${{ env.OTP_VERSION }}
          elixir-version: ${{ env.ELIXIR_VERSION }}

      - name: Install pinned Rust toolchain (rust-toolchain.toml)
        run: rustup toolchain install

      - name: Set the version from the tag
        run: scripts/set-version.sh "${GITHUB_REF_NAME#v}"

      # Without TRIE_HARD_BUILD: downloads this runner's NIF through the normal
      # install path and checks it against the checksum file being shipped.
      - name: Compile with the precompiled NIF
        env:
          MIX_ENV: dev
        run: |
          mix deps.get
          mix compile
          mix run --no-start -e 'trie = TrieHard.new(); :ok = TrieHard.insert(trie, "a", 1); {:ok, 1} = TrieHard.fetch(trie, "a")'

      - name: Publish to Hex
        env:
          MIX_ENV: dev
          HEX_API_KEY: ${{ secrets.HEX_API_KEY }}
        run: mix hex.publish --yes
